# GitHub Actions workflow for 360workai. To use it, copy it to .github/workflows/ at the repository root (it only runs for changes under 360workai/).
name: 360workai
on:
  push:
    paths: ["360workai/**"]
  pull_request:
    paths: ["360workai/**"]

defaults:
  run:
    working-directory: 360workai

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build --nologo -warnaserror
      - run: dotnet test --nologo --no-build

  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: password }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ppassword" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build --nologo
      - name: Same tests, on MySQL (one throwaway database per test class)
        run: dotnet test --nologo --no-build
        env:
          WORKAI_TEST_MYSQL: Server=127.0.0.1;User=root;Password=password

  migrations:
    # The checked-in migration must match the model: fails when an entity changed and no migration was added.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet tool install --global dotnet-ef --version "10.*"
      - run: dotnet build --nologo src/WorkAI360.Api
      - run: dotnet ef migrations has-pending-model-changes --no-build --project src/WorkAI360.Api

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.api -t workai360-api .
      - run: docker build -f deploy/Dockerfile.web -t workai360-web .
