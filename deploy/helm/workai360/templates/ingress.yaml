{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "workai360.fullname" . }}
  labels: {{- include "workai360.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.webHost | quote }}
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ include "workai360.fullname" . }}-web, port: { name: http } } } }]
    - host: {{ .Values.ingress.apiHost | quote }}
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ include "workai360.fullname" . }}-api, port: { name: http } } } }]
{{- end }}
