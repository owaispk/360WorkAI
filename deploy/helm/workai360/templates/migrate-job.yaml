{{- if .Values.migration.enabled }}
# Brings the database up to date before new API pods start (docs/database.md). Runs on install and every upgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "workai360.fullname" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "workai360.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {{- include "workai360.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "workai360.image" (merge (dict "appVersion" .Chart.AppVersion) .Values.image.api) }}
          args: ["--migrate"]
          {{- include "workai360.securityContext" . | nindent 10 }}
          env: {{- include "workai360.apiEnv" . | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }, { name: home, mountPath: /home/app }]
      volumes: [{ name: tmp, emptyDir: {} }, { name: home, emptyDir: {} }]
{{- end }}
