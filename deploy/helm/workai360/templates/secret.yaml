{{- if not .Values.existingSecret }}
{{- if or (lt (len .Values.secrets.authSecret) 32) (not .Values.secrets.databaseConnectionString) }}
{{- fail "Set secrets.authSecret (32+ characters) and secrets.databaseConnectionString, or name an existingSecret." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workai360.secretName" . }}
  labels: {{- include "workai360.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth-secret: {{ .Values.secrets.authSecret | quote }}
  database-connection-string: {{ .Values.secrets.databaseConnectionString | quote }}
  {{- with .Values.secrets.smtpPassword }}
  smtp-password: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.redisConnectionString }}
  redis-connection-string: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.litellmMasterKey }}
  litellm-master-key: {{ . | quote }}
  {{- end }}
{{- end }}
